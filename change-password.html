<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Password — G7 Capital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet">

<script src="assets/auth.js?v=18"></script>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23080808'/><text y='.9em' font-size='70' font-family='serif' fill='%23C9A84C'>G</text></svg>">

<style>

/* ─────────────────────────────────────────────
   RESET & VARIABLES
───────────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%;font-size:16px}
:root{
  --black:#080808;--black2:#0F0F0F;--black3:#161616;--black4:#1E1E1E;
  --gold:#C9A84C;--gold2:#E2C97E;--gold3:#A8873A;
  --white:#FAFAF8;--white2:#F0EFE9;
  --grey1:#8A8880;--grey2:#5A5855;
  --border:rgba(201,168,76,0.15);--border2:rgba(250,250,248,0.08);
  --red:#C45A5A
}
body{
  font-family:'Tenor Sans',sans-serif;
  background:var(--black);
  color:var(--white);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  cursor:none;
  position:relative
}

/* ─────────────────────────────────────────────
   GRAIN TEXTURE
───────────────────────────────────────────── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:1000;opacity:.4
}

/* ─────────────────────────────────────────────
   CUSTOM CURSOR
───────────────────────────────────────────── */
.cursor{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transition:transform .15s ease;transform:translate(-50%,-50%);left:-100px;top:-100px}
.cursor-ring{position:fixed;width:36px;height:36px;border:1px solid rgba(201,168,76,.5);border-radius:50%;pointer-events:none;z-index:9998;transition:all .12s ease;transform:translate(-50%,-50%);left:-100px;top:-100px}
@media(max-width:480px){.cursor,.cursor-ring{display:none}body{cursor:auto}}

/* ─────────────────────────────────────────────
   PAGE LAYOUT
───────────────────────────────────────────── */
.login-wrap{
  width:100%;
  max-width:440px;
  padding:0 24px;
  position:relative;
  z-index:1;
  opacity:0;
  animation:fadeUp .8s ease .1s both
}

/* ─────────────────────────────────────────────
   WORDMARK / LOGO
───────────────────────────────────────────── */
.login-logo{
  text-align:center;
  margin-bottom:48px
}
.login-logo-text{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:300;
  letter-spacing:.35em;
  text-transform:uppercase;
  color:var(--white);
  text-decoration:none
}
.login-logo-text em{font-style:normal;color:var(--gold)}
.login-logo-sub{
  margin-top:10px;
  font-size:9px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--grey2)
}

/* ─────────────────────────────────────────────
   CARD
───────────────────────────────────────────── */
.login-card{
  background:var(--black2);
  border:1px solid var(--border2);
  padding:48px 40px 40px;
}
@media(max-width:480px){.login-card{padding:36px 24px 28px}}

.login-heading{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;
  font-weight:300;
  letter-spacing:.05em;
  color:var(--white);
  margin-bottom:8px
}
.login-sub{
  font-size:11px;
  letter-spacing:.1em;
  color:var(--grey1);
  margin-bottom:36px;
  line-height:1.7
}

/* ─────────────────────────────────────────────
   FORM FIELDS
───────────────────────────────────────────── */
.field{margin-bottom:20px}
.field label{
  display:block;
  font-size:9px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--grey1);
  margin-bottom:8px
}
.field input{
  width:100%;
  background:var(--black3);
  border:1px solid var(--border2);
  color:var(--white);
  font-family:'Tenor Sans',sans-serif;
  font-size:14px;
  padding:14px 16px;
  outline:none;
  transition:border-color .25s;
  letter-spacing:.03em
}
.field input::placeholder{color:var(--grey2)}
.field input:focus{border-color:rgba(201,168,76,0.4)}
.field-helper{
  margin-top:6px;
  font-size:10px;
  letter-spacing:.04em;
  color:var(--grey2);
  line-height:1.5
}

/* ─────────────────────────────────────────────
   ERROR MESSAGE
───────────────────────────────────────────── */
.login-error{
  display:none;
  background:rgba(196,90,90,0.08);
  border:1px solid rgba(196,90,90,0.25);
  color:#e08080;
  font-size:11px;
  letter-spacing:.05em;
  line-height:1.6;
  padding:12px 14px;
  margin-bottom:20px
}
.login-error.visible{display:block}

/* ─────────────────────────────────────────────
   BUTTON
───────────────────────────────────────────── */
.btn-signin{
  width:100%;
  background:var(--gold);
  color:var(--black);
  font-family:'Tenor Sans',sans-serif;
  font-size:10px;
  letter-spacing:.25em;
  text-transform:uppercase;
  border:none;
  padding:16px 24px;
  cursor:pointer;
  transition:background .25s,transform .15s;
  margin-top:8px;
  position:relative
}
.btn-signin:hover:not(:disabled){background:var(--gold2)}
.btn-signin:active:not(:disabled){transform:scale(.99)}
.btn-signin:disabled{opacity:.6;cursor:wait}

.btn-spinner{
  display:none;
  width:12px;height:12px;
  border:1.5px solid rgba(8,8,8,0.3);
  border-top-color:var(--black);
  border-radius:50%;
  animation:spin .6s linear infinite;
  position:absolute;right:20px;top:50%;transform:translateY(-50%)
}
.btn-signin.loading .btn-spinner{display:block}
.btn-signin.loading .btn-label{opacity:0.6}

/* ─────────────────────────────────────────────
   DECORATIVE GOLD LINE
───────────────────────────────────────────── */
.gold-line{
  width:40px;height:1px;
  background:var(--gold);
  opacity:.4;
  margin:0 auto 32px
}

/* ─────────────────────────────────────────────
   ANIMATION
───────────────────────────────────────────── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

</style>
</head>
<body>

<!-- Custom cursor -->
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Page wrapper -->
<div class="login-wrap">

  <!-- Wordmark -->
  <div class="login-logo">
    <a href="index.html" class="login-logo-text">
      <em>G</em>7 Capital
    </a>
    <div class="login-logo-sub">Workspace</div>
  </div>

  <div class="gold-line"></div>

  <!-- Card -->
  <div class="login-card">
    <h1 class="login-heading">Choose your own password</h1>
    <p class="login-sub">Your account was set up with a temporary password. Replace it with one only you know.</p>

    <!-- Error message (hidden by default) -->
    <div class="login-error" id="cpError"></div>

    <!-- Form -->
    <form id="cpForm" onsubmit="handleChangePassword(event)">

      <div class="field">
        <label for="currentPassword">Current Password</label>
        <input
          type="password"
          id="currentPassword"
          placeholder="The one you were given"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="field">
        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          placeholder="At least 8 characters"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Type it again"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="recoveryEmail">Recovery Email (optional)</label>
        <input
          type="email"
          id="recoveryEmail"
          placeholder="you@example.com"
          autocomplete="email"
        >
        <div class="field-helper">So you can reset your password yourself if you ever forget it.</div>
      </div>

      <button type="submit" class="btn-signin" id="cpBtn">
        <span class="btn-label">Save and continue &rarr;</span>
        <span class="btn-spinner"></span>
      </button>

    </form>
  </div>

</div><!-- end login-wrap -->

<script>

// ─────────────────────────────────────────────────────────────
// ON LOAD — if there is no session, send to login
// ─────────────────────────────────────────────────────────────
(function() {
  if (!localStorage.getItem('g7_session_token')) {
    window.location.href = 'login.html';
  }
})();


// ─────────────────────────────────────────────────────────────
// FORM SUBMIT HANDLER
// ─────────────────────────────────────────────────────────────
async function handleChangePassword(event) {
  event.preventDefault();

  var currentPassword = document.getElementById('currentPassword').value;
  var newPassword     = document.getElementById('newPassword').value;
  var confirmPassword = document.getElementById('confirmPassword').value;
  var recoveryEmail   = document.getElementById('recoveryEmail').value.trim();
  var btn             = document.getElementById('cpBtn');
  var errorEl         = document.getElementById('cpError');

  // Clear previous error
  errorEl.classList.remove('visible');
  errorEl.textContent = '';

  // Client-side validation
  if (newPassword.length < 8) {
    errorEl.textContent = 'Your new password must be at least 8 characters.';
    errorEl.classList.add('visible');
    return;
  }
  if (newPassword !== confirmPassword) {
    errorEl.textContent = 'The two new passwords do not match.';
    errorEl.classList.add('visible');
    return;
  }

  // Show loading state
  btn.disabled = true;
  btn.classList.add('loading');
  btn.querySelector('.btn-label').textContent = 'Saving\u2026';

  try {
    var response = await fetch(G7_WORKER + '/auth/change-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem('g7_session_token')
      },
      body: JSON.stringify({
        currentPassword: currentPassword,
        newPassword: newPassword,
        recoveryEmail: recoveryEmail || undefined
      })
    });

    if (!response.ok) {
      var msg = '';
      try {
        var errJson = await response.json();
        msg = (errJson && errJson.error) || '';
      } catch (e) {}

      // Session expired — clear flags and send to login
      if (response.status === 401 && msg && msg.toLowerCase().indexOf('session') !== -1) {
        localStorage.removeItem('g7_must_change');
        localStorage.removeItem('g7_after_change');
        window.location.href = 'login.html';
        return;
      }

      if (!msg) msg = 'Could not save your new password. Please try again.';
      throw new Error(msg);
    }

    // Success — clear the flag and go where the user was headed
    var dest = localStorage.getItem('g7_after_change') || 'login.html';
    localStorage.removeItem('g7_must_change');
    localStorage.removeItem('g7_after_change');
    window.location.href = dest;

  } catch(err) {
    errorEl.textContent = err.message || 'Something went wrong. Please try again.';
    errorEl.classList.add('visible');

    btn.disabled = false;
    btn.classList.remove('loading');
    btn.querySelector('.btn-label').textContent = 'Save and continue \u2192';
  }
}


// ─────────────────────────────────────────────────────────────
// CUSTOM CURSOR
// ─────────────────────────────────────────────────────────────
(function() {
  var cursor     = document.getElementById('cursor');
  var cursorRing = document.getElementById('cursorRing');
  if (!cursor) return;

  document.addEventListener('mousemove', function(e) {
    cursor.style.left     = e.clientX + 'px';
    cursor.style.top      = e.clientY + 'px';
    cursorRing.style.left = e.clientX + 'px';
    cursorRing.style.top  = e.clientY + 'px';
  });

  document.addEventListener('mousedown', function() {
    cursor.style.transform = 'translate(-50%,-50%) scale(1.8)';
  });
  document.addEventListener('mouseup', function() {
    cursor.style.transform = 'translate(-50%,-50%) scale(1)';
  });
})();

</script>
</body>
</html>
