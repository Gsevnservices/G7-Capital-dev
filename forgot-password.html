<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — G7 Capital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23080808'/><text y='.9em' font-size='70' font-family='serif' fill='%23C9A84C'>G</text></svg>">

<style>

/* ─────────────────────────────────────────────
   RESET & VARIABLES
───────────────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{height:100%;font-size:16px}
:root{
  --black:#080808;--black2:#0F0F0F;--black3:#161616;--black4:#1E1E1E;
  --gold:#C9A84C;--gold2:#E2C97E;--gold3:#A8873A;
  --white:#FAFAF8;--white2:#F0EFE9;
  --grey1:#8A8880;--grey2:#5A5855;
  --border:rgba(201,168,76,0.15);--border2:rgba(250,250,248,0.08);
  --red:#C45A5A
}
body{
  font-family:'Tenor Sans',sans-serif;
  background:var(--black);
  color:var(--white);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow-x:hidden;
  cursor:none;
  position:relative
}

/* ─────────────────────────────────────────────
   GRAIN TEXTURE
───────────────────────────────────────────── */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:1000;opacity:.4
}

/* ─────────────────────────────────────────────
   CUSTOM CURSOR
───────────────────────────────────────────── */
.cursor{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transition:transform .15s ease;transform:translate(-50%,-50%);left:-100px;top:-100px}
.cursor-ring{position:fixed;width:36px;height:36px;border:1px solid rgba(201,168,76,.5);border-radius:50%;pointer-events:none;z-index:9998;transition:all .12s ease;transform:translate(-50%,-50%);left:-100px;top:-100px}
@media(max-width:480px){.cursor,.cursor-ring{display:none}body{cursor:auto}}

/* ─────────────────────────────────────────────
   PAGE LAYOUT
───────────────────────────────────────────── */
.login-wrap{
  width:100%;
  max-width:440px;
  padding:0 24px;
  position:relative;
  z-index:1;
  opacity:0;
  animation:fadeUp .8s ease .1s both
}

/* ─────────────────────────────────────────────
   WORDMARK / LOGO
───────────────────────────────────────────── */
.login-logo{
  text-align:center;
  margin-bottom:48px
}
.login-logo-text{
  font-family:'Cormorant Garamond',serif;
  font-size:28px;
  font-weight:300;
  letter-spacing:.35em;
  text-transform:uppercase;
  color:var(--white);
  text-decoration:none
}
.login-logo-text em{font-style:normal;color:var(--gold)}
.login-logo-sub{
  margin-top:10px;
  font-size:9px;
  letter-spacing:.3em;
  text-transform:uppercase;
  color:var(--grey2)
}

/* ─────────────────────────────────────────────
   CARD
───────────────────────────────────────────── */
.login-card{
  background:var(--black2);
  border:1px solid var(--border2);
  padding:48px 40px 40px;
}
@media(max-width:480px){.login-card{padding:36px 24px 28px}}

.login-heading{
  font-family:'Cormorant Garamond',serif;
  font-size:32px;
  font-weight:300;
  letter-spacing:.05em;
  color:var(--white);
  margin-bottom:8px
}
.login-sub{
  font-size:11px;
  letter-spacing:.1em;
  color:var(--grey1);
  margin-bottom:36px;
  line-height:1.7
}

/* ─────────────────────────────────────────────
   FORM FIELDS
───────────────────────────────────────────── */
.field{margin-bottom:20px}
.field label{
  display:block;
  font-size:9px;
  letter-spacing:.25em;
  text-transform:uppercase;
  color:var(--grey1);
  margin-bottom:8px
}
.field input{
  width:100%;
  background:var(--black3);
  border:1px solid var(--border2);
  color:var(--white);
  font-family:'Tenor Sans',sans-serif;
  font-size:14px;
  padding:14px 16px;
  outline:none;
  transition:border-color .25s;
  letter-spacing:.03em
}
.field input::placeholder{color:var(--grey2)}
.field input:focus{border-color:rgba(201,168,76,0.4)}
.field input.uppercase{text-transform:uppercase;letter-spacing:.12em}

/* ─────────────────────────────────────────────
   ERROR MESSAGE
───────────────────────────────────────────── */
.login-error{
  display:none;
  background:rgba(196,90,90,0.08);
  border:1px solid rgba(196,90,90,0.25);
  color:#e08080;
  font-size:11px;
  letter-spacing:.05em;
  line-height:1.6;
  padding:12px 14px;
  margin-bottom:20px
}
.login-error.visible{display:block}

/* ─────────────────────────────────────────────
   BUTTON
───────────────────────────────────────────── */
.btn-signin{
  width:100%;
  background:var(--gold);
  color:var(--black);
  font-family:'Tenor Sans',sans-serif;
  font-size:10px;
  letter-spacing:.25em;
  text-transform:uppercase;
  border:none;
  padding:16px 24px;
  cursor:pointer;
  transition:background .25s,transform .15s;
  margin-top:8px;
  position:relative
}
.btn-signin:hover:not(:disabled){background:var(--gold2)}
.btn-signin:active:not(:disabled){transform:scale(.99)}
.btn-signin:disabled{opacity:.6;cursor:wait}

.btn-spinner{
  display:none;
  width:12px;height:12px;
  border:1.5px solid rgba(8,8,8,0.3);
  border-top-color:var(--black);
  border-radius:50%;
  animation:spin .6s linear infinite;
  position:absolute;right:20px;top:50%;transform:translateY(-50%)
}
.btn-signin.loading .btn-spinner{display:block}
.btn-signin.loading .btn-label{opacity:0.6}

/* ─────────────────────────────────────────────
   SENT CONFIRMATION MESSAGE
───────────────────────────────────────────── */
.sent-msg{
  font-size:13px;
  letter-spacing:.03em;
  color:var(--grey1);
  line-height:1.8
}

/* ─────────────────────────────────────────────
   BELOW CARD — BACK LINK
───────────────────────────────────────────── */
.login-footer{
  text-align:center;
  margin-top:32px;
  font-size:11px;
  letter-spacing:.06em;
  color:var(--grey2);
  line-height:1.8
}
.login-footer a{color:var(--gold);text-decoration:none;transition:color .2s}
.login-footer a:hover{color:var(--gold2)}

/* ─────────────────────────────────────────────
   DECORATIVE GOLD LINE
───────────────────────────────────────────── */
.gold-line{
  width:40px;height:1px;
  background:var(--gold);
  opacity:.4;
  margin:0 auto 32px
}

/* ─────────────────────────────────────────────
   ANIMATION
───────────────────────────────────────────── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}

</style>
</head>
<body>

<!-- Custom cursor -->
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- Page wrapper -->
<div class="login-wrap">

  <!-- Wordmark -->
  <div class="login-logo">
    <a href="index.html" class="login-logo-text">
      <em>G</em>7 Capital
    </a>
    <div class="login-logo-sub">Workspace</div>
  </div>

  <div class="gold-line"></div>

  <!-- Card -->
  <div class="login-card" id="fpCard">
    <h1 class="login-heading">Forgot your password?</h1>
    <p class="login-sub">Enter your firm code. If your account has a recovery email, we'll send a link to reset it.</p>

    <!-- Error message (hidden by default) -->
    <div class="login-error" id="fpError"></div>

    <!-- Form -->
    <form id="fpForm" onsubmit="handleForgot(event)">

      <div class="field">
        <label for="firmCode">Firm Code</label>
        <input
          type="text"
          id="firmCode"
          class="uppercase"
          placeholder="e.g. ANDREESSEN"
          autocapitalize="characters"
          required
        >
      </div>

      <button type="submit" class="btn-signin" id="fpBtn">
        <span class="btn-label">Send reset link &rarr;</span>
        <span class="btn-spinner"></span>
      </button>

    </form>
  </div>

  <!-- Below card -->
  <p class="login-footer">
    <a href="login.html">&larr; Back to sign in</a>
  </p>

</div><!-- end login-wrap -->

<script>

/* No auth.js on this page — no session required */
var G7W = 'https://g7-proxy.gsevnservices.workers.dev';

/* ─────────────────────────────────────────────────────────────
   UPPERCASE INPUT
───────────────────────────────────────────────────────────── */
document.getElementById('firmCode').addEventListener('input', function() {
  var pos = this.selectionStart;
  this.value = this.value.toUpperCase();
  this.setSelectionRange(pos, pos);
});

/* ─────────────────────────────────────────────────────────────
   FORM SUBMIT HANDLER
───────────────────────────────────────────────────────────── */
async function handleForgot(event) {
  event.preventDefault();

  var firmCode = document.getElementById('firmCode').value.trim().toUpperCase();
  var btn      = document.getElementById('fpBtn');
  var errorEl  = document.getElementById('fpError');

  /* Clear previous error */
  errorEl.classList.remove('visible');
  errorEl.textContent = '';

  if (!firmCode) {
    errorEl.textContent = 'Enter your firm code.';
    errorEl.classList.add('visible');
    return;
  }

  /* Loading state */
  btn.disabled = true;
  btn.classList.add('loading');
  btn.querySelector('.btn-label').textContent = 'Sending\u2026';

  try {
    await fetch(G7W + '/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ firmCode: firmCode })
    });
  } catch (e) {
    /* Network failure — show the same generic message */
  }

  /* Always show the same confirmation regardless of outcome */
  showSent();
}

/* ─────────────────────────────────────────────────────────────
   Replace the form with the sent confirmation
───────────────────────────────────────────────────────────── */
function showSent() {
  var card = document.getElementById('fpCard');
  card.innerHTML =
    '<p class="sent-msg">' +
      'If that account has a recovery email, a reset link is on its way. ' +
      'It works once and expires in 30\u00a0minutes. Check your spam folder too.' +
    '</p>';
}


/* ─────────────────────────────────────────────────────────────
   CUSTOM CURSOR
───────────────────────────────────────────────────────────── */
(function() {
  var cursor     = document.getElementById('cursor');
  var cursorRing = document.getElementById('cursorRing');
  if (!cursor) return;

  document.addEventListener('mousemove', function(e) {
    cursor.style.left     = e.clientX + 'px';
    cursor.style.top      = e.clientY + 'px';
    cursorRing.style.left = e.clientX + 'px';
    cursorRing.style.top  = e.clientY + 'px';
  });

  document.addEventListener('mousedown', function() {
    cursor.style.transform = 'translate(-50%,-50%) scale(1.8)';
  });
  document.addEventListener('mouseup', function() {
    cursor.style.transform = 'translate(-50%,-50%) scale(1)';
  });
})();

</script>
</body>
</html>
