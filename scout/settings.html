<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — G7 Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet">
<script src="../assets/auth.js?v=18"></script>
<script src="../assets/scout.js?v=35"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23080808'/><text y='.9em' font-size='70' font-family='serif' fill='%23C9A84C'>G</text></svg>">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
:root{
  --black:#080808;--black2:#0F0F0F;--black3:#161616;--black4:#1E1E1E;
  --gold:#C9A84C;--gold-l:#E2C97E;--gold-m:#A8873A;
  --white:#FAFAF8;--white2:#F0EFE9;--grey1:#8A8880;--grey2:#5A5855;
  --border:rgba(201,168,76,0.15);--border2:rgba(250,250,248,0.08)
}
body{font-family:'Tenor Sans',sans-serif;background:var(--black);color:var(--white);overflow-x:hidden;cursor:none;min-height:100vh;visibility:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:1000;opacity:.4}
.cursor{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transition:transform .15s ease;transform:translate(-50%,-50%);left:-100px;top:-100px}
.cursor-ring{position:fixed;width:36px;height:36px;border:1px solid rgba(201,168,76,.5);border-radius:50%;pointer-events:none;z-index:9998;transition:all .12s ease;transform:translate(-50%,-50%);left:-100px;top:-100px}
@media(max-width:480px){.cursor,.cursor-ring{display:none}body{cursor:auto}}
nav{position:fixed;top:0;left:0;right:0;z-index:999;display:flex;align-items:center;justify-content:space-between;padding:0 64px;height:80px;background:rgba(8,8,8,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2)}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:var(--white);text-decoration:none}
.nav-logo em{font-style:normal;color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:32px}
.nav-link{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey1);text-decoration:none;transition:color .3s}
.nav-link:hover{color:var(--white)}
.nav-link.active{color:var(--gold)}
.nav-firm-indicator{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(201,168,76,0.6);margin-right:8px}
.nav-logout{font-size:9px;letter-spacing:.15em;text-transform:uppercase;background:transparent;border:1px solid rgba(201,168,76,0.4);color:var(--gold);padding:6px 16px;cursor:pointer;transition:all .3s;font-family:'Tenor Sans',sans-serif}
.nav-logout:hover{border-color:var(--gold);background:rgba(201,168,76,0.08)}
@media(max-width:768px){nav{padding:0 24px}.nav-link{display:none}}

.page-header{margin-top:80px;padding:56px 64px 40px;border-bottom:1px solid var(--border2)}
.eyebrow{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.page-heading{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,42px);font-weight:300;line-height:1.2;color:var(--white)}
@media(max-width:768px){.page-header{padding:40px 24px 32px}}

/* ── Settings layout ── */
.settings-wrap{max-width:560px;margin:0 auto;padding:40px 24px 100px}
.settings-section{margin-bottom:40px}
.settings-section-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.s-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;min-height:44px}
.s-row-label{font-size:13px;color:var(--grey1);line-height:1.4}
.s-toggle{background:transparent;border:0;padding:8px 0;font-family:inherit;font-size:10px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:flex-end}
.s-toggle.on{color:var(--gold)}
.s-toggle.off{color:var(--grey2)}
.s-input{width:100%;background:var(--black3);border:1px solid var(--border2);color:var(--white);font-family:'Tenor Sans',sans-serif;font-size:13px;padding:12px 14px;outline:none;transition:border-color .3s;min-height:44px;box-sizing:border-box}
.s-input:focus{border-color:var(--gold)}
.s-input-row{display:flex;gap:8px;align-items:center}
.s-btn{background:transparent;border:1px solid rgba(201,168,76,0.4);color:var(--gold);font-family:'Tenor Sans',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:10px 20px;cursor:pointer;transition:all .3s;min-height:44px;white-space:nowrap}
.s-btn:hover{border-color:var(--gold);background:rgba(201,168,76,0.08)}
.s-hint{font-size:11px;color:var(--grey2);line-height:1.5;margin-top:6px}
.s-err{font-size:11px;color:#C45A5A;margin-top:6px;display:none}
.s-saved{font-size:11px;color:var(--gold);margin-top:6px;display:none}
.s-link{font-size:12px;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(201,168,76,0.4);padding-bottom:1px;transition:border-color .3s}
.s-link:hover{border-color:var(--gold)}
.s-lang-btn{background:transparent;border:0;padding:8px 4px;font-family:inherit;font-size:10px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;min-height:44px;display:flex;align-items:center}
.s-lang-btn.active{color:var(--gold)}
.s-lang-btn:not(.active){color:var(--grey2)}
.s-news-cats{margin-top:10px}
.s-news-cats label{display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;font-size:13px;color:var(--grey1);min-height:44px}
.s-news-cats input[type="checkbox"]{width:18px;height:18px;accent-color:var(--gold);cursor:pointer}
.s-note{font-size:12px;color:var(--grey2);line-height:1.6;margin-bottom:14px}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="index.html" class="nav-logo">G<em>7</em> Scout</a>
  <div class="nav-right">
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="news.html" class="nav-link">News</a>
    <a href="onboard.html" class="nav-link">New Analysis</a>
    <a href="history.html" class="nav-link">History</a>
    <a href="checkin.html" class="nav-link">Check-In</a>
    <a href="pipeline.html" class="nav-link">Customers</a>
    <a href="settings.html" class="nav-link active">Settings</a>
    <span class="nav-firm-indicator" id="navFirmName"></span>
    <button class="nav-logout" onclick="handleLogout()">Sign Out</button>
  </div>
</nav>

<div class="page-header">
  <div class="eyebrow">Scout</div>
  <h1 class="page-heading">Settings</h1>
</div>

<div class="settings-wrap" id="settingsWrap">

  <!-- EMAILS -->
  <div class="settings-section" id="s-emails">
    <div class="settings-section-label">Emails</div>
    <div id="emailSettings">
      <div style="font-size:13px;color:var(--grey2)">Loading&hellip;</div>
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="settings-section" id="s-messages">
    <div class="settings-section-label">Messages</div>
    <div class="s-row">
      <span class="s-row-label">Message language</span>
      <span id="langPicker" style="display:flex;gap:4px"></span>
    </div>
  </div>

  <!-- REVIEWS -->
  <div class="settings-section" id="s-reviews">
    <div class="settings-section-label">Reviews</div>
    <div style="margin-bottom:14px">
      <div class="s-row-label" style="margin-bottom:8px">Google review link</div>
      <div class="s-input-row">
        <input class="s-input" type="url" id="reviewLink" placeholder="https://g.page/&hellip;">
        <button class="s-btn" id="reviewSave">Save</button>
      </div>
      <div class="s-hint">Find it: Google Business Profile &rarr; Ask for reviews &rarr; Copy link.</div>
      <div class="s-err" id="reviewErr"></div>
      <div class="s-saved" id="reviewSaved">Saved</div>
    </div>
    <div class="s-row">
      <span class="s-row-label">Ask customers for reviews</span>
      <button class="s-toggle" id="reviewToggle"></button>
    </div>
  </div>

  <!-- NEWS -->
  <div class="settings-section" id="s-news">
    <div class="settings-section-label">News</div>
    <div id="newsCats">
      <div style="font-size:13px;color:var(--grey2)">Loading&hellip;</div>
    </div>
  </div>

  <!-- ACCOUNT -->
  <div class="settings-section" id="s-account">
    <div class="settings-section-label">Account</div>
    <div id="accountSettings">
      <div style="font-size:13px;color:var(--grey2)">Loading&hellip;</div>
    </div>
  </div>

</div>

<script>

var _auth = {};
var _emailState = { actions: false, news: false, on: false, hasEmail: false, email: '' };

/* ── INIT ── */
window.addEventListener('DOMContentLoaded', async function() {
  var token = localStorage.getItem('g7_session_token');
  if (!token) { window.location.href = '../login.html?product=scout'; return; }
  document.body.style.visibility = 'visible';
  _auth = { 'Authorization': 'Bearer ' + token };

  migrateUnscopedScoutKeys();
  await loadScoutStateFromServer();

  renderEmails();
  renderLanguage();
  renderReviews();
  renderNews();
  renderAccount();

  /* Scroll to hash section */
  if (location.hash) {
    var target = document.getElementById('s-' + location.hash.slice(1));
    if (target) setTimeout(function() { target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
  }
});

/* ── FLASH HELPERS ── */
function flashSaved(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.style.display = '';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.display = 'none'; }, 2000);
}
function flashErr(id, msg) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.style.display = '';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.style.display = 'none'; }, 4000);
}

/* ═══════════════════════════════════════
   EMAILS
═══════════════════════════════════════ */
async function renderEmails() {
  var el = document.getElementById('emailSettings');
  try {
    var r = await fetch(SCOUT_WORKER + '/scout/brief-email', { headers: _auth });
    if (r.ok) _emailState = await r.json();
  } catch (e) { el.innerHTML = '<div class="s-note">Could not load email settings.</div>'; return; }

  if (!_emailState.hasEmail) {
    el.innerHTML =
      '<div class="s-note">Add a recovery email first so Scout can send you daily briefings.</div>' +
      '<div class="s-note" style="margin-top:4px">You can add one in the Account section below.</div>';
    return;
  }

  var html = '';
  html += '<div class="s-row">' +
    '<span class="s-row-label">Daily actions email</span>' +
    '<button class="s-toggle ' + (_emailState.actions ? 'on' : 'off') + '" id="emailActionsToggle">' +
    (_emailState.actions ? 'On' : 'Off') + '</button></div>';
  html += '<div class="s-row">' +
    '<span class="s-row-label">News email</span>' +
    '<button class="s-toggle ' + (_emailState.news ? 'on' : 'off') + '" id="emailNewsToggle">' +
    (_emailState.news ? 'On' : 'Off') + '</button></div>';
  html += '<div class="s-saved" id="emailSaved">Saved</div>';
  el.innerHTML = html;

  document.getElementById('emailActionsToggle').onclick = function() { saveEmailToggle({ actions: !_emailState.actions }); };
  document.getElementById('emailNewsToggle').onclick = function() { saveEmailToggle({ news: !_emailState.news }); };
}

async function saveEmailToggle(body) {
  try {
    var r = await fetch(SCOUT_WORKER + '/scout/brief-email', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, _auth),
      body: JSON.stringify(body)
    });
    if (!r.ok) { var j = await r.json().catch(function(){ return {}; }); flashErr('emailSaved', j.error || 'Could not save.'); return; }
  } catch (e) {}
  flashSaved('emailSaved');
  renderEmails();
}

/* ═══════════════════════════════════════
   LANGUAGE
═══════════════════════════════════════ */
async function renderLanguage() {
  var lp = document.getElementById('langPicker');
  if (!lp) return;
  var cur = 'Hinglish';
  try {
    var r = await fetch(SCOUT_WORKER + '/scout/message-lang', { headers: _auth });
    if (r.ok) { var j = await r.json(); cur = j.language || cur; }
  } catch (e) {}

  var langs = ['English', 'Hinglish', 'Hindi'];
  lp.innerHTML = langs.map(function(l) {
    return '<button class="s-lang-btn ' + (l === cur ? 'active' : '') + '" data-lang="' + l + '">' + l + '</button>';
  }).join('');

  lp.querySelectorAll('button').forEach(function(b) {
    b.onclick = async function() {
      var picked = b.getAttribute('data-lang');
      try {
        await fetch(SCOUT_WORKER + '/scout/message-lang', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, _auth),
          body: JSON.stringify({ language: picked })
        });
      } catch (e) {}
      renderLanguage();
    };
  });
}

/* ═══════════════════════════════════════
   REVIEWS
═══════════════════════════════════════ */
function renderReviews() {
  /* Review link */
  var rl = '';
  try { rl = localStorage.getItem(scoutKey('scout_review_link')) || ''; } catch(e) {}
  document.getElementById('reviewLink').value = rl;

  document.getElementById('reviewSave').onclick = function() {
    var val = (document.getElementById('reviewLink').value || '').trim();
    if (val && !val.match(/^https:\/\//i)) {
      flashErr('reviewErr', "That doesn\u2019t look like a link \u2014 it should start with https://");
      document.getElementById('reviewLink').focus();
      return;
    }
    try {
      localStorage.setItem(scoutKey('scout_review_link'), val);
      if (typeof saveScoutStateToServer === 'function') saveScoutStateToServer();
    } catch(e) {}
    document.getElementById('reviewErr').style.display = 'none';
    flashSaved('reviewSaved');
  };

  /* Review asks toggle */
  var skip = false;
  try { skip = localStorage.getItem(scoutKey('scout_review_skip')) === 'true'; } catch(e) {}
  var btn = document.getElementById('reviewToggle');
  btn.textContent = skip ? 'Off' : 'On';
  btn.className = 's-toggle ' + (skip ? 'off' : 'on');
  btn.onclick = function() {
    var cur = localStorage.getItem(scoutKey('scout_review_skip')) === 'true';
    var next = !cur;
    try {
      if (next) localStorage.setItem(scoutKey('scout_review_skip'), 'true');
      else localStorage.removeItem(scoutKey('scout_review_skip'));
      if (typeof saveScoutStateToServer === 'function') saveScoutStateToServer();
    } catch(e) {}
    renderReviews();
  };
}

/* ═══════════════════════════════════════
   NEWS CATEGORIES
═══════════════════════════════════════ */
async function renderNews() {
  var el = document.getElementById('newsCats');
  try {
    var r = await fetch(SCOUT_WORKER + '/scout/news-prefs', { headers: _auth });
    if (!r.ok) throw new Error();
    var pj = await r.json();
    var current = pj.prefs || [];
    var options = pj.options || [];

    var html = '';
    html += '<div class="s-news-cats">';
    options.forEach(function(o) {
      var ck = current.indexOf(o.key) !== -1 ? ' checked' : '';
      html += '<label>' +
        '<input type="checkbox" value="' + escHtml(o.key) + '"' + ck + '>' +
        escHtml(o.label) + '</label>';
    });
    html += '</div>';
    html += '<button class="s-btn" id="newsSave" style="margin-top:12px">Save</button>';
    html += '<div class="s-saved" id="newsSaved">Saved &mdash; takes effect from tomorrow&rsquo;s news</div>';
    el.innerHTML = html;

    document.getElementById('newsSave').onclick = async function() {
      var picks = [];
      el.querySelectorAll('input[type="checkbox"]:checked').forEach(function(cb) { picks.push(cb.value); });
      try {
        var sr = await fetch(SCOUT_WORKER + '/scout/news-prefs', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, _auth),
          body: JSON.stringify({ prefs: picks })
        });
        if (!sr.ok) throw new Error();
        flashSaved('newsSaved');
      } catch (e) {
        flashErr('newsSaved', 'Could not save. Try again.');
      }
    };
  } catch (e) {
    el.innerHTML = '<div class="s-note">Could not load news categories.</div>';
  }
}

/* ═══════════════════════════════════════
   ACCOUNT
═══════════════════════════════════════ */
async function renderAccount() {
  var el = document.getElementById('accountSettings');
  var email = '';
  try {
    var r = await fetch(SCOUT_WORKER + '/scout/recovery-email', { headers: _auth });
    if (r.ok) { var j = await r.json(); email = j.email || ''; }
  } catch (e) {}

  var hasEmail = !!email;
  var html = '';
  html += '<div style="margin-bottom:14px">' +
    '<div class="s-row-label" style="margin-bottom:8px">Recovery email</div>';
  if (hasEmail) {
    html += '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:10px">' +
      '<span style="font-size:13px;color:var(--white)">' + escHtml(email) + '</span>' +
      '<a href="#" id="accountChangeLink" style="font-size:11px;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(201,168,76,0.4)">Change</a></div>';
    html += '<div id="accountChangeForm" style="display:none">';
    html += '<div class="s-row-label" style="margin-bottom:6px;font-size:11px">New email</div>';
    html += '<input class="s-input" type="email" id="accountEmail" placeholder="you@example.com" style="margin-bottom:8px">';
    html += '<div class="s-row-label" style="margin-bottom:6px;font-size:11px">Current password</div>';
    html += '<input class="s-input" type="password" id="accountPassword" placeholder="" style="margin-bottom:8px">';
    html += '<button class="s-btn" id="accountEmailSave">Update</button>';
    html += '<div class="s-err" id="accountEmailErr"></div>';
    html += '<div class="s-saved" id="accountEmailSaved">Saved</div>';
    html += '</div>';
  } else {
    html += '<input class="s-input" type="email" id="accountEmail" placeholder="you@example.com" style="margin-bottom:8px">';
    html += '<button class="s-btn" id="accountEmailSave">Save</button>';
    html += '<div class="s-err" id="accountEmailErr"></div>';
    html += '<div class="s-saved" id="accountEmailSaved">Saved</div>';
  }
  html += '</div>';
  html += '<div>' +
    '<a href="../change-password.html" class="s-link">Change password</a>' +
    '</div>';
  el.innerHTML = html;

  /* Reveal change form on tap */
  var changeLink = document.getElementById('accountChangeLink');
  if (changeLink) {
    changeLink.onclick = function(e) {
      e.preventDefault();
      document.getElementById('accountChangeForm').style.display = '';
      changeLink.style.display = 'none';
      document.getElementById('accountEmail').focus();
    };
  }

  document.getElementById('accountEmailSave').onclick = async function() {
    var val = (document.getElementById('accountEmail').value || '').trim();
    if (!val || !val.match(/.+@.+\..+/)) {
      flashErr('accountEmailErr', 'Enter a valid email address.');
      document.getElementById('accountEmail').focus();
      return;
    }
    var body = { email: val };
    if (hasEmail) {
      var pw = (document.getElementById('accountPassword').value || '');
      if (!pw) {
        flashErr('accountEmailErr', 'Enter your current password to change the email.');
        document.getElementById('accountPassword').focus();
        return;
      }
      body.currentPassword = pw;
    }
    try {
      var r = await fetch(SCOUT_WORKER + '/scout/recovery-email', {
        method: 'POST',
        headers: Object.assign({ 'Content-Type': 'application/json' }, _auth),
        body: JSON.stringify(body)
      });
      if (!r.ok) { var j = await r.json().catch(function(){ return {}; }); flashErr('accountEmailErr', j.error || 'Could not save.'); return; }
    } catch (e) { flashErr('accountEmailErr', 'Could not save. Check your connection.'); return; }
    document.getElementById('accountEmailErr').style.display = 'none';
    flashSaved('accountEmailSaved');
    /* Refresh both sections — email state affects Emails section too */
    renderAccount();
    renderEmails();
  };
}

/* ── LOGOUT ── */
function handleLogout() {
  scoutClearLocalState();
  ['g7_session_token','g7_session_firm','g7_session_name'].forEach(function(k){ localStorage.removeItem(k); });
  window.location.href = 'landing.html';
}

/* ── CUSTOM CURSOR ── */
function initCursor() {
  var c = document.getElementById('cursor'), r = document.getElementById('cursorRing');
  if (!c || !r) return;
  document.addEventListener('mousemove', function(e){ c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px'; });
  document.addEventListener('mousedown', function(){ c.style.transform='translate(-50%,-50%) scale(0.7)';r.style.transform='translate(-50%,-50%) scale(0.8)'; });
  document.addEventListener('mouseup',   function(){ c.style.transform='translate(-50%,-50%) scale(1)';r.style.transform='translate(-50%,-50%) scale(1)'; });
}
initCursor();

</script>
</body>
</html>
