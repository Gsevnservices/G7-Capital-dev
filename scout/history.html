<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acquisition History — G7 Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet">
<script src="../assets/scout-master-v1.js?v=16"></script>
<script src="../assets/auth.js?v=16"></script>
<script src="../assets/scout.js?v=16"></script>
<script src="../assets/pipeline.js?v=16"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23080808'/><text y='.9em' font-size='70' font-family='serif' fill='%23C9A84C'>G</text></svg>">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;font-size:16px}
:root{
  --black:#080808;--black2:#0F0F0F;--black3:#161616;--black4:#1E1E1E;
  --gold:#C9A84C;--gold2:#E2C97E;--gold3:#A8873A;
  --white:#FAFAF8;--white2:#F0EFE9;--grey1:#8A8880;--grey2:#5A5855;
  --border:rgba(224,146,47,0.15);--border2:rgba(250,250,248,0.08)
}
body{font-family:'Tenor Sans',sans-serif;background:var(--black);color:var(--white);overflow-x:hidden;cursor:none;min-height:100vh;visibility:hidden}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:1000;opacity:.4}
.cursor{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transition:transform .15s ease;transform:translate(-50%,-50%);left:-100px;top:-100px}
.cursor-ring{position:fixed;width:36px;height:36px;border:1px solid rgba(224,146,47,.5);border-radius:50%;pointer-events:none;z-index:9998;transition:all .12s ease;transform:translate(-50%,-50%);left:-100px;top:-100px}
@media(max-width:480px){.cursor,.cursor-ring{display:none}body{cursor:auto}}
nav{position:fixed;top:0;left:0;right:0;z-index:999;display:flex;align-items:center;justify-content:space-between;padding:0 64px;height:80px;background:rgba(8,8,8,.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2)}
.nav-logo{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;letter-spacing:.25em;text-transform:uppercase;color:var(--white);text-decoration:none}
.nav-logo em{font-style:normal;color:var(--gold)}
.nav-right{display:flex;align-items:center;gap:32px}
.nav-link{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey1);text-decoration:none;transition:color .3s}
.nav-link:hover{color:var(--white)}
.nav-link.active{color:var(--gold)}
.nav-firm-indicator{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(224,146,47,0.6);margin-right:8px}
.nav-logout{font-size:9px;letter-spacing:.15em;text-transform:uppercase;background:transparent;border:1px solid rgba(224,146,47,0.4);color:var(--gold);padding:6px 16px;cursor:pointer;transition:all .3s;font-family:'Tenor Sans',sans-serif}
.nav-logout:hover{border-color:var(--gold);background:rgba(224,146,47,0.08)}
@media(max-width:768px){nav{padding:0 24px}.nav-link{display:none}}

/* PAGE HEADER */
.page-header{margin-top:80px;padding:56px 64px 40px;border-bottom:1px solid var(--border2)}
.eyebrow{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.page-heading{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,42px);font-weight:300;line-height:1.2;color:var(--white);margin-bottom:12px}
.page-subheading{font-size:13px;line-height:1.9;color:var(--grey1);max-width:520px}
@media(max-width:768px){.page-header{padding:40px 24px 32px}}

/* MOMENTUM CHART SECTION */
.chart-section{
  padding:40px 64px;
  border-bottom:1px solid var(--border2);
  background:var(--black2)
}
.chart-label{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:24px}
.momentum-chart{
  display:flex;align-items:flex-end;
  gap:8px;height:120px;
  border-bottom:1px solid var(--border2);
  padding-bottom:0
}
.chart-bar-wrap{
  display:flex;flex-direction:column;
  align-items:center;gap:8px;flex:1
}
.chart-bar{
  width:100%;background:var(--border);
  border-radius:0;transition:height .6s ease;
  position:relative;min-height:2px
}
.chart-bar.current{background:var(--gold)}
.chart-bar:not(.current){background:var(--gold3);opacity:.5}
.chart-bar-score{
  font-size:9px;color:var(--grey2);
  text-align:center;letter-spacing:.05em
}
.chart-bar-week{
  font-size:8px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--grey2);text-align:center
}
.chart-bar-week.current-label{color:var(--gold)}
.chart-empty{
  font-size:12px;color:var(--grey2);letter-spacing:.05em;
  padding:24px 0;text-align:center;width:100%
}
@media(max-width:768px){.chart-section{padding:28px 24px}}

/* HISTORY LIST */
.history-section{
  max-width:900px;margin:0 auto;
  padding:40px 64px 80px
}
@media(max-width:768px){.history-section{padding:28px 24px 80px}}

.history-header-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px
}
.history-section-title{
  font-family:'Cormorant Garamond',serif;
  font-size:20px;font-weight:300;color:var(--white)
}
.btn-checkin-link{
  font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  background:var(--gold);color:var(--black);border:none;
  padding:10px 24px;cursor:pointer;font-weight:600;
  font-family:'Tenor Sans',sans-serif;text-decoration:none;
  display:inline-block;transition:background .3s
}
.btn-checkin-link:hover{background:var(--gold2)}

/* HISTORY WEEK CARDS */
.week-card{
  background:var(--black2);border:1px solid var(--border2);
  margin-bottom:12px;transition:border-color .25s
}
.week-card:hover{border-color:rgba(224,146,47,0.3)}
.week-card-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--border2)
}
.week-card-left{display:flex;align-items:center;gap:16px}
.week-num{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:300;color:var(--gold)
}
.week-date{font-size:10px;letter-spacing:.1em;color:var(--grey2)}
.momentum-pill{
  font-size:9px;letter-spacing:.12em;
  border:1px solid var(--border);
  color:var(--gold);padding:4px 12px
}
.week-card-stats{
  display:flex;gap:0;padding:0
}
.stat-cell{
  flex:1;padding:16px 20px;
  border-right:1px solid var(--border2);
  text-align:center
}
.stat-cell:last-child{border-right:none}
.stat-val{
  font-family:'Cormorant Garamond',serif;
  font-size:20px;font-weight:300;color:var(--white);
  margin-bottom:2px
}
.stat-lbl{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey2)}
.week-card-footer{
  padding:12px 24px;
  display:flex;justify-content:flex-end
}
.view-link{
  font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--gold);text-decoration:none;transition:color .25s
}
.view-link:hover{color:var(--gold2)}
@media(max-width:600px){
  .week-card-stats{flex-wrap:wrap}
  .stat-cell{min-width:50%;border-bottom:1px solid var(--border2)}
  .stat-cell:nth-child(even){border-right:none}
  .stat-cell:nth-last-child(-n+2){border-bottom:none}
}

/* EMPTY STATE */
.empty-state{
  text-align:center;padding:80px 40px
}
.empty-state-icon{
  font-family:'Cormorant Garamond',serif;
  font-size:48px;font-weight:300;color:var(--gold);
  opacity:.3;margin-bottom:24px;line-height:1
}
.empty-state-title{
  font-family:'Cormorant Garamond',serif;
  font-size:22px;font-weight:300;color:var(--white);
  margin-bottom:8px
}
.empty-state-desc{
  font-size:12px;line-height:1.8;color:var(--grey1);
  max-width:360px;margin:0 auto 28px
}
.btn-start{
  display:inline-block;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  background:var(--gold);color:var(--black);padding:12px 28px;
  text-decoration:none;font-weight:600;font-family:'Tenor Sans',sans-serif;
  transition:background .3s
}
.btn-start:hover{background:var(--gold2)}
</style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- NAV -->
<nav>
  <a href="index.html" class="nav-logo">G<em>7</em> Scout</a>
  <div class="nav-right">
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="onboard.html" class="nav-link">New Analysis</a>
    <a href="history.html" class="nav-link active">History</a>
    <a href="checkin.html" class="nav-link">Check-In</a>
    <a href="pipeline.html" class="nav-link">Pipeline</a>
    <span class="nav-firm-indicator" id="navFirmName"></span>
    <button class="nav-logout" onclick="handleLogout()">Sign Out</button>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="eyebrow">Your Progress</div>
  <h1 class="page-heading">Acquisition History</h1>
  <p class="page-subheading">Every week Scout learns more about your market. Your playbook sharpens with every check-in.</p>
</div>

<!-- MOMENTUM CHART -->
<div class="chart-section">
  <div class="chart-label">Momentum Over Time</div>
  <div class="momentum-chart" id="momentumChart">
    <div class="chart-empty">Complete your first week to see your momentum chart.</div>
  </div>
</div>

<!-- HISTORY LIST -->
<div class="history-section">
  <div class="history-header-row">
    <div class="history-section-title">Weekly Results</div>
    <a href="checkin.html" class="btn-checkin-link">Friday Check-In →</a>
  </div>
  <div id="historyList">
    <!-- Rendered by JS -->
  </div>
</div>

<script>

/* ═══════════════════════════════════════
   PAGE INIT
═══════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async function() {
  var token = localStorage.getItem('g7_session_token');
  if (!token) { window.location.href = '../login.html?product=scout'; return; }

  document.body.style.visibility = 'visible';

  migrateUnscopedScoutKeys();
  await loadScoutStateFromServer();

  var firmName = localStorage.getItem('g7_session_name') || '';
  if (firmName) document.getElementById('navFirmName').textContent = firmName;

  var history = [];
  try {
    var raw = localStorage.getItem(scoutKey('scout_history'));
    if (raw) history = JSON.parse(raw);
  } catch(e) {}

  if (history.length === 0) {
    renderEmpty();
  } else {
    renderChart(history);
    renderHistory(history);
  }

  initCursor();
});

/* ═══════════════════════════════════════
   RENDER MOMENTUM CHART
   CSS-only bar chart — no libraries
═══════════════════════════════════════ */
function renderChart(history) {
  var container = document.getElementById('momentumChart');
  if (!history || history.length === 0) return;

  /* Only plot check-in entries that have a health score */
  var plotEntries = history.filter(function(w) {
    return isCheckinEntry(w) && w.healthScore !== undefined;
  });
  if (plotEntries.length === 0) return;

  /* Find max score for scaling */
  var maxScore = 0;
  plotEntries.forEach(function(w) { if (w.healthScore > maxScore) maxScore = w.healthScore; });
  if (maxScore === 0) maxScore = 100;

  var html = '';
  var lastIdx = plotEntries.length - 1;

  plotEntries.forEach(function(week, i) {
    var score     = week.healthScore;
    var isCurrent = i === lastIdx;
    /* Scale bar height: max 100px, min 2px */
    var barH = Math.max(2, Math.round((score / maxScore) * 100));

    html += '<div class="chart-bar-wrap">';
    html += '<div class="chart-bar-score">' + score + '</div>';
    html += '<div class="chart-bar' + (isCurrent ? ' current' : '') + '" style="height:' + barH + 'px"></div>';
    html += '<div class="chart-bar-week' + (isCurrent ? ' current-label' : '') + '">W' + week.week + '</div>';
    html += '</div>';
  });

  container.innerHTML = html;
}

/* ═══════════════════════════════════════
   RENDER HISTORY LIST
═══════════════════════════════════════ */
function renderHistory(history) {
  var container = document.getElementById('historyList');
  if (!history || history.length === 0) {
    renderEmpty();
    return;
  }

  /* Newest first — filter to check-in entries only */
  var sorted = history.slice().reverse().filter(isCheckinEntry);
  if (sorted.length === 0) { renderEmpty(); return; }
  var html = '';

  sorted.forEach(function(week) {
    var date    = formatDate(week.date);
    var score   = week.healthScore !== undefined ? week.healthScore : '—';
    var sent    = (parseInt(week.icp1_sent || '0', 10) + parseInt(week.icp2_sent || '0', 10) + parseInt(week.icp3_sent || '0', 10));
    var replies = (parseInt(week.icp1_replies || '0', 10) + parseInt(week.icp2_replies || '0', 10) + parseInt(week.icp3_replies || '0', 10));
    var custNew = week.totalCustomers || '0';
    var revenue = week.revenueAdded   || '0';
    /* history.indexOf uses object reference — finds original index in unfiltered array */
    var origIdx = history.indexOf(week);

    html += '<div class="week-card">';

    /* Header */
    html += '<div class="week-card-header">';
    html += '<div class="week-card-left">';
    html += '<div class="week-num">Week ' + week.week + '</div>';
    html += '<div class="week-date">' + date + '</div>';
    html += '</div>';
    html += '<div class="momentum-pill">' + score + (score !== '—' ? '/100' : '') + '</div>';
    html += '</div>';

    /* Stats row */
    html += '<div class="week-card-stats">';
    html += '<div class="stat-cell"><div class="stat-val">' + sent + '</div><div class="stat-lbl">Contacts</div></div>';
    html += '<div class="stat-cell"><div class="stat-val">' + replies + '</div><div class="stat-lbl">Responses</div></div>';
    html += '<div class="stat-cell"><div class="stat-val">' + escHtml(custNew) + '</div><div class="stat-lbl">New Customers</div></div>';
    html += '<div class="stat-cell"><div class="stat-val">₹' + escHtml(revenue) + '</div><div class="stat-lbl">Revenue Added</div></div>';
    html += '</div>';

    /* Footer link — loads this week's output into result.html */
    html += '<div class="week-card-footer">';
    html += '<a href="#" class="view-link" onclick="viewWeek(' + origIdx + ');return false;">View Full Playbook →</a>';
    html += '</div>';

    html += '</div>';
  });

  container.innerHTML = html;
}

/* ═══════════════════════════════════════
   VIEW A PAST WEEK'S PLAYBOOK
   Loads that week's scoutOutput into
   scout_pending_result → navigates to result.html
═══════════════════════════════════════ */
function viewWeek(idx) {
  var history = [];
  try { history = JSON.parse(localStorage.getItem(scoutKey('scout_history')) || '[]'); } catch(e) {}
  if (!history[idx]) return;

  var week = history[idx];
  /* Merge into pending result so result.html renders it */
  var pending = {};
  try { pending = JSON.parse(localStorage.getItem(scoutKey('scout_pending_result')) || '{}'); } catch(e) {}
  if (week.scoutOutput) pending.scoutOutput = week.scoutOutput;
  localStorage.setItem(scoutKey('scout_pending_result'), JSON.stringify(pending));
  window.location.href = 'result.html';
}

/* ═══════════════════════════════════════
   EMPTY STATE
═══════════════════════════════════════ */
function renderEmpty() {
  document.getElementById('historyList').innerHTML =
    '<div class="empty-state">' +
    '<div class="empty-state-icon">S</div>' +
    '<div class="empty-state-title">No history yet</div>' +
    '<div class="empty-state-desc">Complete your first week and submit a Friday check-in to see your progress here.</div>' +
    '<a href="onboard.html" class="btn-start">Start Your First Analysis →</a>' +
    '</div>';
}

/* ═══════════════════════════════════════
   UTILITIES
═══════════════════════════════════════ */
function formatDate(iso) {
  if (!iso) return '';
  try {
    var d = new Date(iso);
    return d.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
  } catch(e) { return iso.slice(0, 10); }
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ═══════════════════════════════════════
   LOGOUT
═══════════════════════════════════════ */
function handleLogout() {
    /* Identity keys are raw; Scout data keys are firm-scoped */
    ['g7_session_token','g7_session_firm','g7_session_name'].forEach(function(k){ localStorage.removeItem(k); });
    ['scout_pending_result','scout_history','scout_week_number','scout_streak',
     'scout_last_checkin_week','scout_health_score','scout_health_breakdown',
     'scout_weekly_insight','scout_insight_week','scout_last_targets','scout_icp_names',
     'scout_first_customer_celebrated','scout_week_checklist','scout_referral_chain',
     'scout_pipeline'
    ].forEach(function(base){ localStorage.removeItem(scoutKey(base)); });
    window.location.href = 'landing.html';
  }

/* ═══════════════════════════════════════
   CURSOR
═══════════════════════════════════════ */
function initCursor() {
  var c = document.getElementById('cursor'), r = document.getElementById('cursorRing');
  if (!c || !r) return;
  document.addEventListener('mousemove', function(e){ c.style.left=e.clientX+'px';c.style.top=e.clientY+'px';r.style.left=e.clientX+'px';r.style.top=e.clientY+'px'; });
  document.addEventListener('mousedown', function(){ c.style.transform='translate(-50%,-50%) scale(0.7)';r.style.transform='translate(-50%,-50%) scale(0.8)'; });
  document.addEventListener('mouseup',   function(){ c.style.transform='translate(-50%,-50%) scale(1)';r.style.transform='translate(-50%,-50%) scale(1)'; });
}
</script>
</body>
</html>
